# Netlify configuration for the Bhuvana Nursery frontend.
#
# Deploy the monorepo and let Netlify use the `frontend` directory as its base.
# The proxy destination below must be the real Render service hostname. It is
# set to the confirmed production service: bhuvana-nursery-api1.onrender.com.
# Netlify does not substitute environment variables inside redirect targets,
# so if the Render service is ever renamed, update both redirects by hand.
#
# The /api and /uploads proxy keeps the browser on one origin. That is what
# makes the HttpOnly session cookie and the CSRF cookie first-party; do not
# replace it with a cross-site VITE_API_BASE_URL unless you also configure
# CORS_ALLOWED_ORIGINS and COOKIE_SAME_SITE=None on the backend.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# API proxy (preserves /api/v1/... and query strings).
[[redirects]]
  from = "/api/*"
  to = "https://bhuvana-nursery-api1.onrender.com/api/:splat"
  status = 200
  force = true

# Legacy/local image paths stored in the database. New uploads live in R2 and
# use absolute URLs, so this proxy mainly keeps older records working.
[[redirects]]
  from = "/uploads/*"
  to = "https://bhuvana-nursery-api1.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback: refreshing /plants/foo or /admin/... must not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
