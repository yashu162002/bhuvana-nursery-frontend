<!doctype html>
<html lang="kn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1f16" />
    <meta
      name="description"
      content="ಭೂವನ ನರ್ಸರಿ — Bhoovana Nursery, Chitradurga. Fruit plants, agricultural plants, trees and natural manure."
    />
    <title>ಭೂವನ ನರ್ಸರಿ · Bhoovana Nursery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!--
      Each font family has its own <link>. If one family is ever renamed or
      unavailable, only that font falls back - the rest keep working.

      Kannada display fonts used for headings:
        Akaya Kanadaka        - hero (calligraphic display)
        Anek Kannada (600)    - "collection" section + menu (clean modern display)
        Baloo Tamma 2         - plant catalogue (rounded, friendly, heavy)
        Noto Serif Kannada    - about section (classic bookish serif)
        Tiro Kannada          - statement + contact (elegant, has italic)
        BhuTuka Expanded One  - marquee + footer wordmark (wide, bold)
        Anek Kannada          - UI / body text (modern variable font)
      Latin pairing: Cormorant Garamond (display) + Jost (UI).
    -->
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@400;600;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=BhuTuka+Expanded+One&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- Used by the admin panel -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
