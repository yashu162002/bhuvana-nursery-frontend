# Test profile: connects to a dedicated, disposable database so tests never
# touch the developer's catalogue data. Create it once with:
#   createdb -U postgres bhuvana_nursery_test
spring.datasource.url=jdbc:postgresql://localhost:5432/bhuvana_nursery_test

# Never inherit production database credentials from .env. Provide the local
# test database credentials through TEST_DB_USERNAME / TEST_DB_PASSWORD.
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}

# Values used by AdminUserInitializer while the test database is empty.
ADMIN_USERNAME=testadmin
ADMIN_PASSWORD=StartupPass123
ADMIN_EMAIL=testadmin@example.com

app.password-reset.base-url=http://localhost:5199
app.password-reset.ttl-minutes=20

# Generous per-IP budget so tests never trip it; the per-email budget stays
# small enough for the dedicated rate-limit test (unique emails elsewhere).
app.password-reset.rate-limit.requests-per-ip=10000
app.password-reset.rate-limit.requests-per-email=3
app.password-reset.rate-limit.window-minutes=60

# No SMTP server in tests: PasswordResetEmailSender is replaced by a mock.
spring.mail.host=

# Sign-in throttling: generous here so unrelated tests never trip it. The
# dedicated LoginRateLimitIntegrationTest overrides these with small values.
app.auth.login-rate-limit.requests-per-ip=10000
app.auth.login-rate-limit.requests-per-account=10000
app.auth.login-rate-limit.window-minutes=15
