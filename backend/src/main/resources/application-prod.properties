# Production defaults. Enable with SPRING_PROFILES_ACTIVE=prod.
#
# Keeps secure behaviour on even if an individual variable is forgotten:
# HTTPS-only cookies, and trusted client-IP headers honoured because the
# deployment sits behind Netlify/Render proxies.
#
# This project is deployed behind the recommended Netlify same-origin proxy,
# so SameSite=Lax works. If the frontend calls the API cross-site instead,
# set COOKIE_SAME_SITE=None (requires HTTPS) and configure CORS_ALLOWED_ORIGINS.
app.security.cookie-secure=${SECURE_COOKIES:true}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:true}

# Informative logs without request bodies or verbose framework internals.
logging.level.root=INFO
logging.level.org.springframework.security=WARN
