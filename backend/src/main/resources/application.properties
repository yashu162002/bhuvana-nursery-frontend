spring.application.name=nursery-api

# Render (and most PaaS providers) inject the port to bind to. 8080 stays the
# local-development default.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Optional local secrets file (gitignored). Lets developers keep DB and SMTP
# credentials out of source control: copy .env.example to .env and edit.
# On Render there is no .env: configuration comes from environment variables.
# The second path makes `java -jar backend/target/...` from the repository root
# load the same backend/.env; without it the app silently falls back to the
# localhost database and can authenticate against the wrong administrator.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:file:./.env.local[.properties]

# PostgreSQL connection (values come from the environment / .env, never source)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bhuvana_nursery}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool suitable for Neon's free/starter tiers. keepalive-time keeps
# pooled connections from being culled during quieter periods.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns schema creation and updates. Retries smooth over Neon wake-up.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=${DB_CONNECT_RETRIES:3}
spring.flyway.connect-retries-interval=5s

# Actuator: only health/info, never details or credentials.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# SMTP is optional here; never let /actuator/health report DOWN when the
# administrator has not configured an App Password yet.
management.health.mail.enabled=false

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Session cookie. Secure + SameSite are environment-specific: behind the
# recommended Netlify same-origin proxy use Secure=true, SameSite=Lax. If the
# frontend calls the API on a different site, use SameSite=None (requires
# Secure=true and HTTPS).
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ---------------------------------------------------------------------------
# Image storage.
#   local (default): files under app.upload.directory, served at /uploads/**.
#                    Fine locally; Render's filesystem is EPHEMERAL.
#   r2:              Cloudflare R2 (S3-compatible), required in production.
# ---------------------------------------------------------------------------
app.upload.directory=${UPLOAD_DIRECTORY:./uploads}
app.storage.provider=${IMAGE_STORAGE:local}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.storage.r2.region=${R2_REGION:auto}

# ---------------------------------------------------------------------------
# Security hardening (all overridable from the environment)
# ---------------------------------------------------------------------------
# Session/CSRF cookies: set SECURE_COOKIES=true and COOKIE_SAME_SITE=None when
# the frontend is served from a different site than the API over HTTPS.
app.security.cookie-secure=${SECURE_COOKIES:false}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}
# Only enable behind a trusted reverse proxy. When enabled, Netlify's
# X-Nf-Client-Connection-Ip is preferred; otherwise the nearest X-Forwarded-For
# hop is used. The first XFF hop is never trusted.
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
# Comma-separated list of exact frontend origins allowed to call the API with
# credentials (for example https://bhuvanursery.com). Leave empty when the
# frontend and API share an origin through a proxy; never use "*".
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Sign-in throttling (per client address and per account).
app.auth.login-rate-limit.requests-per-ip=20
app.auth.login-rate-limit.requests-per-account=10
app.auth.login-rate-limit.window-minutes=15

# ---------------------------------------------------------------------------
# Gmail SMTP for admin password resets.
# Use a Google App Password (16 chars), never the regular Gmail password.
# When SMTP_HOST is unset the forgot-password endpoint answers 503 and no
# email is attempted.
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# Password reset behaviour
# ---------------------------------------------------------------------------
# Public URL of the deployed frontend; the emailed link points here.
# APP_BASE_URL is the production name, FRONTEND_BASE_URL is kept for existing
# local setups, and localhost:5173 is only the development fallback.
app.password-reset.base-url=${APP_BASE_URL:${FRONTEND_BASE_URL:http://localhost:5173}}
app.password-reset.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
# ADMIN_EMAIL (the address that may request a reset) is read directly from the
# environment by AdminUserInitializer and seeded into admin_users.email on
# first boot; no default is defined here on purpose.
# Reset tokens: single use, short lived.
app.password-reset.ttl-minutes=20
app.password-reset.rate-limit.requests-per-ip=10
app.password-reset.rate-limit.requests-per-email=3
app.password-reset.rate-limit.window-minutes=60
